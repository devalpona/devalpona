<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="id-t id-d">
<title id="id-t">DEVALPONA identity mark</title>
<desc id="id-d">Outlined typographic identity for devalpona with a geometric monogram and the line Code, Motion, Generative Form.</desc>
<defs>
<radialGradient id="id-bg1" cx="78%" cy="30%" r="70%"><stop offset="0" stop-color="#BE185D" stop-opacity=".55"/><stop offset=".45" stop-color="#2A0A1C" stop-opacity=".6"/><stop offset="1" stop-color="#0A0408" stop-opacity="0"/></radialGradient>
<radialGradient id="id-bg2" cx="8%" cy="95%" r="55%"><stop offset="0" stop-color="#FDA4AF" stop-opacity=".12"/><stop offset="1" stop-color="#0A0408" stop-opacity="0"/></radialGradient>
<linearGradient id="id-silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#FCE7F3"/><stop offset="1" stop-color="#B79AAA"/></linearGradient>
<linearGradient id="id-scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F9A8D4" stop-opacity="0"/><stop offset=".5" stop-color="#F9A8D4" stop-opacity=".55"/><stop offset="1" stop-color="#F9A8D4" stop-opacity="0"/></linearGradient>
<linearGradient id="id-vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0408" stop-opacity="0"/><stop offset="1" stop-color="#0A0408" stop-opacity=".85"/></linearGradient>
<filter id="id-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="id-glowH" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
<pattern id="id-grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#B79AAA" stroke-opacity=".07" stroke-width="1"/></pattern>
<style>
@keyframes id-spin{to{transform:rotate(360deg)}}
@keyframes id-spinr{to{transform:rotate(-360deg)}}
@keyframes id-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,8px)}}
@keyframes id-driftb{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-6px)}}
@keyframes id-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes id-scan{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--h));opacity:0}}
.id-spin{animation:id-spin 90s linear infinite}
.id-spinr{animation:id-spinr 140s linear infinite}
.id-far{animation:id-drift 57.6s ease-in-out infinite}
.id-mid{animation:id-driftb 36s ease-in-out infinite}
.id-near{animation:id-drift 25.2s ease-in-out infinite}
.id-pulse{animation:id-pulse 7s ease-in-out infinite}
.id-scanline{animation:id-scan 11s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){[class^="id-"]{animation:none!important}}</style>
</defs>


