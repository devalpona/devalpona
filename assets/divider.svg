<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="1200" height="56" role="img" aria-labelledby="dv-t dv-d">
<title id="dv-t">Section divider</title>
<desc id="dv-d">A technical divider: ruled line with tick marks and a central rotating diamond.</desc>
<defs>
<linearGradient id="dv-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B79AAA" stop-opacity="0"/><stop offset=".5" stop-color="#F9A8D4" stop-opacity=".8"/><stop offset="1" stop-color="#B79AAA" stop-opacity="0"/></linearGradient>
<linearGradient id="dv-fil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EC4899" stop-opacity="0"/><stop offset=".5" stop-color="#F9A8D4"/><stop offset="1" stop-color="#FDA4AF" stop-opacity="0"/></linearGradient>
<filter id="dv-glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
<style>
@keyframes dv-spin{to{transform:rotate(360deg)}}
@keyframes dv-sweep{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(800px);opacity:0}}
.dv-spin{animation:dv-spin 90s linear infinite}
.dv-sweep{animation:dv-sweep 9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){[class^="dv-"]{animation:none!important}}</style>
</defs>

<path d="M120 28H560M640 28H1080" stroke="url(#dv-line)" stroke-width="1"/>
<path d="M120 20V36M140 24.5V31.5M160 24.5V31.5M180 24.5V31.5M200 24.5V31.5M220 24.5V31.5M240 20V36M260 24.5V31.5M280 24.5V31.5M300 24.5V31.5M320 24.5V31.5M340 24.5V31.5M360 20V36M380 24.5V31.5M400 24.5V31.5M420 24.5V31.5M440 24.5V31.5M460 24.5V31.5M480 20V36M500 24.5V31.5M520 24.5V31.5M540 24.5V31.5M560 24.5V31.5M640 24.5V31.5M660 24.5V31.5M680 24.5V31.5M700 24.5V31.5M720 20V36M740 24.5V31.5M760 24.5V31.5M780 24.5V31.5M800 24.5V31.5M820 24.5V31.5M840 20V36M860 24.5V31.5M880 24.5V31.5M900 24.5V31.5M920 24.5V31.5M940 24.5V31.5M960 20V36M980 24.5V31.5M1000 24.5V31.5M1020 24.5V31.5M1040 24.5V31.5M1060 24.5V31.5M1080 20V36" stroke="#B79AAA" stroke-opacity=".6" stroke-width=".8"/>
<g class="dv-spin" style="transform-origin:600px 28px"><rect x="589" y="17" width="22" height="22" transform="rotate(45 600 28)" fill="none" stroke="#F9A8D4" stroke-opacity=".9"/></g>
<rect x="595" y="23" width="10" height="10" transform="rotate(45 600 28)" fill="#FDA4AF" fill-opacity=".9"/>
<g class="dv-sweep"><rect x="120" y="27" width="160" height="2" fill="url(#dv-fil)" filter="url(#dv-glow)"/></g>
</svg>
